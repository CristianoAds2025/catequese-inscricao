<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ficha de Inscrição - Catequese</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-header text-center bg-primary text-white">
            <h4>Ficha de Inscrição - Catequese 1ª Eucaristia</h4>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <h5>Dados do Aluno</h5>

                <div class="mb-3">
                    <label>Nome Completo</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <label>Data de Nascimento</label>
                        <input type="date" name="data_nascimento" class="form-control">
                    </div>

                    <div class="col-md-2">
                        <label>Idade</label>
                        <input type="number" name="idade" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label>Sexo</label>
                        <select name="sexo" class="form-select">
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                        </select>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-md-4">
                        <label>Série</label>
                        <input type="text" name="serie" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label>Turma</label>
                        <input type="text" name="turma" class="form-control">
                    </div>
                </div>

                <div class="mt-3">
                    <label>E-mail</label>
                    <input type="email" name="email" class="form-control">
                </div>

                <div class="mt-3">
                    <label>Celular</label>
                    <input type="text" name="celular" class="form-control">
                </div>

                <div class="mt-3">
                    <label>WhatsApp</label>
                    <input type="text" name="whatsapp" class="form-control">
                </div>

                <hr>

                <h5>Responsáveis</h5>

                <div class="mb-3">
                    <label>Mãe</label>
                    <input type="text" name="mae" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Pai</label>
                    <input type="text" name="pai" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Responsável</label>
                    <input type="text" name="responsavel" class="form-control">
                </div>

                <hr>

                <h5>Informações Religiosas</h5>

                <div class="mb-3">
                    <label>Participa de alguma Paróquia?</label>
                    <select name="participa_paroquia" class="form-select">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Qual?</label>
                    <input type="text" name="qual_paroquia" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Já é batizado(a)?</label>
                    <select name="batizado" class="form-select">
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>

                <hr>

                <h5>Upload de Documentos</h5>

                <div class="mb-3">
                    <label>Certidão de Batismo / RG / Certidão de Nascimento</label>
                    <input type="file" name="documentos" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Foto 3x4</label>
                    <input type="file" name="foto" class="form-control">
                </div>

                <hr>

                <h5>Termo de Ciência</h5>

                <div class="mb-3">
                    <label>Nome do Responsável que Assina</label>
                    <input type="text" name="nome_responsavel_termo" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Data do Preenchimento</label>
                    <input type="date" name="data_preenchimento" class="form-control">
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success">Enviar Inscrição</button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
